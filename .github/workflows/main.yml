name: Build VideoStarTool HSON 3 Features v5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate project directory
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="."
          if [ ! -f "$PROJECT_DIR/Makefile" ] && [ -f "VideoStarTool_HSON_3Features_v5/Makefile" ]; then
            PROJECT_DIR="VideoStarTool_HSON_3Features_v5"
          fi
          if [ ! -f "$PROJECT_DIR/Makefile" ]; then
            echo "ERROR: Makefile not found. Extract the ZIP contents into the repository root, or keep the project folder named VideoStarTool_HSON_3Features_v5." >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          THEOS="$HOME/theos"
          if [ -d "$THEOS/.git" ]; then
            git -C "$THEOS" submodule update --init --recursive
          else
            rm -rf "$THEOS"
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi

          SDK_DIR="$THEOS/sdks"
          mkdir -p "$SDK_DIR"
          if ! find "$SDK_DIR" -mindepth 1 -maxdepth 1 -type d -name '*.sdk' -print -quit | grep -q .; then
            TEMP_SDK="$RUNNER_TEMP/theos-sdks"
            rm -rf "$TEMP_SDK"
            git clone --depth 1 https://github.com/theos/sdks.git "$TEMP_SDK"
            find "$TEMP_SDK" -mindepth 1 -maxdepth 1 -type d -name '*.sdk' -exec cp -R {} "$SDK_DIR"/ \;
          fi

          SDK_FOUND="$(find "$SDK_DIR" -mindepth 1 -maxdepth 1 -type d -name '*.sdk' -print -quit)"
          if [ -z "$SDK_FOUND" ]; then
            echo "ERROR: No iOS SDK found in $SDK_DIR" >&2
            exit 1
          fi
          echo "Using SDK: $SDK_FOUND"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Verify source and three feature mappings
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          required_files=(
            "Makefile"
            "control"
            "HSONModernMenu.plist"
            "Source/Tweak.m"
            "Source/Features/HSONFeatureEngine.m"
            "Source/Features/HSONFeatureEngine.h"
          )
          for path in "${required_files[@]}"; do
            test -f "$path" || { echo "ERROR: missing file: $path" >&2; exit 1; }
          done

          TWEAK="Source/Tweak.m"
          ENGINE="Source/Features/HSONFeatureEngine.m"
          HEADER="Source/Features/HSONFeatureEngine.h"

          need() {
            local file="$1"
            local text="$2"
            local description="$3"
            grep -Fq -- "$text" "$file" || { echo "ERROR: $description" >&2; exit 1; }
