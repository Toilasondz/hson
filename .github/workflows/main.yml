name: Build VideoStarTool HSON 3 Features v5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check project layout
        shell: bash
        run: |
          set -euo pipefail
          for path in Makefile control HSONModernMenu.plist Source/Tweak.m Source/Features/HSONFeatureEngine.m Source/Features/HSONFeatureEngine.h; do
            if [ ! -f "$path" ]; then
              echo "ERROR: Missing $path. Put the contents of VideoStarTool_HSON_3Features_v5 at the repository root." >&2
              exit 1
            fi
          done

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          THEOS="$HOME/theos"

          if [ -d "$THEOS/.git" ]; then
            git -C "$THEOS" submodule update --init --recursive
          else
            if [ -e "$THEOS" ]; then
              rm -rf "$THEOS"
            fi
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi

          SDK_DIR="$THEOS/sdks"
          mkdir -p "$SDK_DIR"
          if ! find "$SDK_DIR" -mindepth 1 -maxdepth 1 -type d -name '*.sdk' -print -quit | grep -q .; then
            TEMP_SDK="$RUNNER_TEMP/theos-sdks"
            rm -rf "$TEMP_SDK"
            git clone --depth 1 https://github.com/theos/sdks.git "$TEMP_SDK"
            cp -R "$TEMP_SDK"/. "$SDK_DIR"/
          fi

          SDK_FOUND="$(find "$SDK_DIR" -mindepth 1 -maxdepth 1 -type d -name '*.sdk' -print -quit)"
          if [ -z "$SDK_FOUND" ]; then
            echo "ERROR: No iOS .sdk found in $SDK_DIR" >&2
            exit 1
          fi
          echo "Using SDK: $SDK_FOUND"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Verify HSON source and three feature mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path.cwd()
          required = [
              "Makefile", "control", "HSONModernMenu.plist",
              "Source/Tweak.m", "Source/Features/HSONFeatureEngine.m",
              "Source/Features/HSONFeatureEngine.h",
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              sys.exit("FAIL: missing project files: " + ", ".join(missing))

          tweak = (root / "Source/Tweak.m").read_text(encoding="utf-8")
          engine = (root / "Source/Features/HSONFeatureEngine.m").read_text(encoding="utf-8")
          header = (root / "Source/Features/HSONFeatureEngine.h").read_text(encoding="utf-8")
          makefile = (root / "Makefile").read_text(encoding="utf-8")
          filter_plist = (root / "HSONModernMenu.plist").read_text(encoding="utf-8")
          control = (root / "control").read_text(encoding="utf-8")

          feature_checks = [
              (0, "Auto nhập ảnh", "startFeatureReplaceMedia"),
